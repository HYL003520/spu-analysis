function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  } catch (e) {
    console.error('[saveData error]', e);
  }
}

function esc(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function num(s) { return parseFloat(s) || 0; }

function sumRows(r, f) {
  return (r || []).reduce(function(a, b) { return a + num(b[f]); }, 0);
}

function calcAll(id) {
  var p = products[id];
  if (!p) return { ts: 0, lv: 0, vd: 0, ml: 0, vp: 0 };
  var ts = sumRows(p.rows,'total') + sumRows(p.weekRows,'total') + sumRows(p.monthRows,'total');
  var lv = sumRows(p.rows,'live') + sumRows(p.weekRows,'live') + sumRows(p.monthRows,'live');
  var vd = sumRows(p.rows,'video') + sumRows(p.weekRows,'video') + sumRows(p.monthRows,'video');
  var ml = sumRows(p.rows,'mall') + sumRows(p.weekRows,'mall') + sumRows(p.monthRows,'mall');
  var vp = ts > 0 ? Math.round(vd / ts * 100) : 0;
  return { ts: ts, lv: lv, vd: vd, ml: ml, vp: vp };
}

// ============ RENDER ============
function renderProductList() {
  var list = document.getElementById('product-list');
  if (!list) return;
  list.innerHTML = '';
  var keys = Object.keys(products);
  keys.forEach(function(id) {
    var p = products[id];
    var div = document.createElement('div');
    div.className = 'product-item' + (id === activeId ? ' active' : '');
    div.setAttribute('data-id', id);
    div.innerHTML = '<span>' + esc(p.spu || id) + '</span><span class="del-btn" data-del-id="' + id + '">x</span>';
    div.addEventListener('click', (function(iid) {
      return function() {
        activeId = iid;
        renderProductList();
        renderProduct(iid);
      };
    })(id));
    list.appendChild(div);
  });
  // Delegate delete
  list.onclick = null;
  list.removeEventListener('click', handleListClick);
  list.addEventListener('click', handleListClick);
}

function handleListClick(e) {
  if (e.target.classList.contains('del-btn')) {
    var id = e.target.getAttribute('data-del-id');
    if (id && confirm('确认删除该产品?')) {
      delete products[id];
      saveData();
      var k = Object.keys(products);
      activeId = k.length > 0 ? k[0] : null;
      renderProductList();
      if (activeId) renderProduct(activeId);
      else renderEmpty();
    }
  }
}

function renderEmpty() {
  var m = document.getElementById('main-area');
  if (!m) return;
  var emptyDiv = document.getElementById('empty-state');
  if (!emptyDiv) {
    m.innerHTML = '<div class="empty-state" id="empty-state"><div class="icon">&#128230;</div><p>暂无产品</p><button class="btn btn-primary" id="btn-add-first">+ 添加第一个产品</button></div>';
    var b = document.getElementById('btn-add-first');
    if (b) b.addEventListener('click', openAddProduct);
  }
}

function handleMainChange(e) {
  var el = e.target;
  if (!el.classList.contains('editable')) return;
  var id = activeId;
  if (!id || !products[id]) return;

  var idx = el.getAttribute('data-idx');
  var widx = el.getAttribute('data-widx');
  var midx = el.getAttribute('data-midx');
  var sug = el.getAttribute('data-sug');
  var f = el.getAttribute('data-f');
  var v = el.value;

  try {
    if (idx !== null && f) {
      products[id].rows[parseInt(idx)][f] = v;
      saveData();
    } else if (widx !== null && f) {
      products[id].weekRows[parseInt(widx)][f] = v;
      saveData();
    } else if (midx !== null && f) {
      products[id].monthRows[parseInt(midx)][f] = v;
      saveData();
    } else if (sug !== null) {
      if (!products[id].suggestions) products[id].suggestions = ['','','','',''];
      products[id].suggestions[parseInt(sug)] = v;
      saveData();
    } else if (el.id === 'ta-analysis') {
      products[id].analysis = v;
      saveData();
    } else if (el.id === 'ta-summary') {
      products[id].summary = v;
      saveData();
    }
  } catch(err) {
    console.error('[handleMainChange error]', err);
  }
}

function handleDashClick(e) {
  var el = e.target.closest('.dash-card');
  if (el) {
    var pid = el.getAttribute('data-switch');
    if (pid && products[pid]) {
      activeId = pid;
      renderProductList();
      renderProduct(pid);
    }
  }
}

// ============ MODAL ============
function openAddProduct() {
  editTargetId = null;
  document.getElementById('modal-title').textContent = '添加新产品';
  document.getElementById('m-spu').value = '';
  document.getElementById('m-pid').value = '';
  document.getElementById('m-name').value = '';
  document.getElementById('m-date').value = '2025-11-17';
  document.getElementById('m-sample').value = '';
  document.getElementById('m-grade').value = '';
  document.getElementById('m-total').value = '';
  document.getElementById('m-price').value = '';
  document.getElementById('modal-product').classList.remove('hidden');
  document.getElementById('m-spu').focus();
}

function openEdit(id) {
  editTargetId = id;
  var p = products[id];
  document.getElementById('modal-title').textContent = '编辑产品';
  document.getElementById('m-spu').value = p.spu || '';
  document.getElementById('m-pid').value = p.pid || '';
  document.getElementById('m-name').value = p.name || '';
  document.getElementById('m-date').value = p.launchDate || '';
  document.getElementById('m-sample').value = p.sampleDate || '';
  document.getElementById('m-grade').value = p.grade || '';
  document.getElementById('m-total').value = p.totalSales || '';
  document.getElementById('m-price').value = p.price || '';
  document.getElementById('modal-product').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-product').classList.add('hidden');
}

function doAddProduct() {
  var spu = document.getElementById('m-spu').value.trim();
  if (!spu) { alert('请输入SPU编号'); return; }
  try {
    if (editTargetId) {
      var pp = products[editTargetId];
      pp.spu = spu;
      pp.pid = document.getElementById('m-pid').value.trim();
      pp.name = document.getElementById('m-name').value.trim();
      pp.launchDate = document.getElementById('m-date').value;
      pp.sampleDate = document.getElementById('m-sample').value;
      pp.grade = document.getElementById('m-grade').value.trim();
      pp.totalSales = document.getElementById('m-total').value.trim();
      pp.price = document.getElementById('m-price').value.trim();
      saveData();
      closeModal();
      renderProductList();
      renderProduct(editTargetId);
      return;
    }
    var nid = 'prod_' + Date.now();
    products[nid] = {
      spu: spu,
      pid: document.getElementById('m-pid').value.trim(),
      name: document.getElementById('m-name').value.trim(),
      launchDate: document.getElementById('m-date').value,
      sampleDate: document.getElementById('m-sample').value,
      grade: document.getElementById('m-grade').value.trim(),
      totalSales: document.getElementById('m-total').value.trim(),
      price: document.getElementById('m-price').value.trim(),
      rows: [], weekRows: [], monthRows: [],
      analysis: '', summary: '', suggestions: ['','','','','']
    };
    saveData();
    closeModal();
    activeId = nid;
    renderProductList();
    renderProduct(nid);
  } catch(err) {
    console.error('[doAddProduct error]', err);
    alert('操作失败: ' + err.message);
  }
}

// ============ AUTO ANALYZE ============
function doAutoAnalyze(id) {
  document.getElementById('analyzing').classList.remove('hidden');
  setTimeout(function() {
    try {
      var result = autoAnalyze(id);
      products[id].analysis = result.analysis;
      products[id].summary = result.summary;
      products[id].suggestions = result.suggestions;
      saveData();
    } catch(err) {
      console.error('[doAutoAnalyze error]', err);
    }
    document.getElementById('analyzing').classList.add('hidden');
    renderProduct(id);
  }, 800);
}

function autoAnalyze(id) {
  var p = products[id];
  if (!p) return { analysis: '', summary: '', suggestions: ['','','','',''] };

  var daily = p.rows || [];
  var weeks = p.weekRows || [];
  var months = p.monthRows || [];

  var ts = sumRows(daily,'total') + sumRows(weeks,'total') + sumRows(months,'total');
  var lv = sumRows(daily,'live') + sumRows(weeks,'live') + sumRows(months,'live');
  var vd = sumRows(daily,'video') + sumRows(weeks,'video') + sumRows(months,'video');
  var ml = sumRows(daily,'mall') + sumRows(weeks,'mall') + sumRows(months,'mall');
  var vp = ts > 0 ? Math.round(vd / ts * 100) : 0;

  var peakDay = null, peakVal = 0;
  for (var i = 0; i < daily.length; i++) {
    var v = num(daily[i].total);
    if (v > peakVal) { peakVal = v; peakDay = daily[i].date; }
  }

  var livePeakDay = null, livePeakVal = 0;
  for (var i2 = 0; i2 < daily.length; i2++) {
    var v2 = num(daily[i2].live);
    if (v2 > livePeakVal) { livePeakVal = v2; livePeakDay = daily[i2].date; }
  }

  var recTotal = sumRows(daily,'recNew');
  var recOrdTotal = sumRows(daily,'recOrd') + sumRows(weeks,'recOrd');
  var aiTotal = sumRows(daily,'aiNew') + sumRows(weeks,'aiNew');
  var aiOrdTotal = sumRows(daily,'aiOrd') + sumRows(weeks,'aiOrd');

  var recDay1 = 0, recOtherSum = 0, recOtherDays = 0;
  for (var i3 = 0; i3 < daily.length; i3++) {
    var rv = num(daily[i3].recNew);
    if (i3 === 1) recDay1 = rv;
    else if (i3 > 1 && rv > 0) { recOtherSum += rv; recOtherDays++; }
  }
  var recOtherAvg = recOtherDays > 0 ? Math.round((recOtherSum / recOtherDays) * 10) / 10 : 0;

  var aiStartDay = null;
  for (var i4 = 0; i4 < daily.length; i4++) {
    if (num(daily[i4].aiNew) > 0 && !aiStartDay) aiStartDay = daily[i4].date;
  }
  if (!aiStartDay) {
    for (var i5 = 0; i5 < weeks.length; i5++) {
      if (num(weeks[i5].aiNew) > 0 && !aiStartDay) aiStartDay = weeks[i5].label;
    }
  }

  var liveStopDay = null;
  for (var i6 = 2; i6 < daily.length; i6++) {
    if (num(daily[i6].live) === 0 && num(daily[i6-1].live) > 0) {
      liveStopDay = daily[i6].date;
      break;
    }
  }

  var sampleGap = '';
  if (p.launchDate && p.sampleDate) {
    var ms = new Date(p.sampleDate) - new Date(p.launchDate);
    sampleGap = Math.round(ms / 86400000) + '天';
  }

  var vdPct = ts > 0 ? Math.round(vd / ts * 100) : 0;
  var lvPct = ts > 0 ? Math.round(lv / ts * 100) : 0;

  var analysis = '';
  analysis += '[第一阶段] 直播测款期: ' + (peakDay ? '峰值' + peakVal + '件(' + peakDay + ')' : '') + (lvPct > 50 ? '直播占比' + lvPct + '%为绝对主力' : '短视频占比更高') + '. 录屏新增' + recTotal + '条, 出单' + recOrdTotal + '件.' + (liveStopDay ? '直播在' + liveStopDay + '后停止.' : '') + ' 录屏第1天' + recDay1 + '条, 但后续日均仅' + recOtherAvg + '条, 严重不足.\n';
  analysis += '[第二阶段] 维稳热度期: 直播停止(' + lvPct + '%), 录屏骤降日均' + recOtherAvg + '条, 远未爆发. 短视频接过主力但出单平淡. AI视频累计' + aiTotal + '条, 出单' + aiOrdTotal + '件.' + (aiStartDay ? ' 在' + aiStartDay + '开始有AI视频.' : '') + '\n';
  analysis += '[第三/四阶段] 爆发期: 短视频占' + vdPct + '%, ' + (vdPct > 70 ? '短视频成为绝对主力' : '短视频占重要比例') + '. 录屏持续发力, AI视频加速.\n';
  analysis += '[第五阶段] 收尾期: 销量自然下滑, ' + (ts > 0 ? '累计总销量' + ts.toLocaleString() + '件' : '') + '.\n';

  var problems = [];
  if (sampleGap && parseInt(sampleGap) > 30) problems.push('寄样间隔' + sampleGap + '超标(应30天内)');
  if (recOtherAvg < 3) problems.push('录屏严重断档(后续日均仅' + recOtherAvg + '条)');
  if (aiTotal < 50) problems.push('AI视频未形成规模(累计' + aiTotal + '条)');
  if (liveStopDay) problems.push('直播过早断播(' + liveStopDay + '后停止)');

  var summary = '核心问题: ' + (problems.length > 0 ? problems.join('; ') : '暂无明显问题');

  var sug0 = '测新后快速锁定小单样品, 7天内完成首批样品采购, 迅速分发. 本品寄样间隔' + sampleGap + (sampleGap && parseInt(sampleGap) > 30 ? ', 严重延误爆款窗口.' : ', 符合标准.');
  var sug1 = '录屏每日保持10条以上, 维稳期不能断档. 本品录屏第1天' + recDay1 + '条, 但后续骤降, ' + (recOtherAvg < 3 ? '严重不足, 需重点改进.' : '基本达标.');
  var sug2 = '测新后立即启动AI视频生产, 目标AI视频占短视频总量60%以上. 本品AI视频' + aiTotal + '条, ' + (aiTotal < 100 ? '未形成规模, 需大力扩展.' : '已具备一定规模.');
  var sug3 = '测新一周后一般无直播, 主播账号视频必须顶上, 发样品之前一定要持续发视频维持热度, 不能让流量断档.' + (liveStopDay ? ' 本例直播在' + liveStopDay + '后停止, 需加强视频接棒.' : '');
  var sug4 = '进入第三阶段后, 增加破圈层达人发样, 加大样品分发速度和分发数量, 通过多层次达人触达更多潜在用户.';

  return {
    analysis: analysis,
    summary: summary,
    suggestions: [sug0, sug1, sug2, sug3, sug4]
  };
}

// ============ INIT ============
(function init() {
  try {
    // Load from localStorage
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch(e) {
      console.error('[localStorage read error]', e);
    }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
          products = parsed;
          var keys = Object.keys(products);
          if (keys.length > 0) activeId = keys[0];
        }
      } catch(e) {
        console.error('[JSON parse error]', e);
      }
    }

    renderProductList();
    if (activeId && products[activeId]) {
      renderProduct(activeId);
    } else {
      renderEmpty();
    }

    // Bind sidebar add button
    var btnAddProd = document.getElementById('btn-add-product');
    if (btnAddProd) btnAddProd.addEventListener('click', openAddProduct);

    // Bind empty state add button
    var btnAddFirst = document.getElementById('btn-add-first');
    if (btnAddFirst) btnAddFirst.addEventListener('click', openAddProduct);

    // Bind modal buttons
    var btnCancel = document.getElementById('btn-modal-cancel');
    if (btnCancel) btnCancel.addEventListener('click', closeModal);

    var btnConfirm = document.getElementById('btn-modal-confirm');
    if (btnConfirm) btnConfirm.addEventListener('click', doAddProduct);

    console.log('[SPU Analysis] Initialized successfully. Active product:', activeId);

  } catch(err) {
    console.error('[Init error]', err);
  }
})();
</script>
